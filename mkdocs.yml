site_name: Knowledge Base
site_description: Personal technical knowledge base — architecture, Java, Spring, databases, Docker, Git
repo_url: https://github.com/<your-username>/knowledge-base
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Software Architecture:
      - software-architecture/index.md
      - API Design: software-architecture/api.md
      - REST: software-architecture/rest.md
      - GraphQL: software-architecture/graphql.md
      - gRPC: software-architecture/grpc.md
      - Microservices: software-architecture/microservices.md
      - Event-Driven Architecture: software-architecture/event-driven.md
      - Load balance: software-architecture/load-balance.md
